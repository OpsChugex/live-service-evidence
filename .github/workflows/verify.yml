name: Verify OpsChugex live service

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: live-service-evidence
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify public health endpoint
        run: python verify_opschugex_api.py --output evidence.json
      - name: Upload time-bound evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocx-live-001-${{ github.run_id }}
          path: evidence.json
          retention-days: 30
      - name: Evidence summary
        run: |
          echo "## OCX-LIVE-001" >> "$GITHUB_STEP_SUMMARY"
          echo "Public API health, database connectivity and scheduler state were verified." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a time-bound service check, not an uptime guarantee." >> "$GITHUB_STEP_SUMMARY"
